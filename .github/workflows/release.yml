name: Release
# Push a tag such as v0.1.0-alpha.1 → binaries for Windows, macOS and Linux and a PRE-RELEASE.
# Tags containing a dash (alpha, beta, rc) are published as pre-releases.
# Without a local git: Actions → Release → "Run workflow" → type the tag (e.g. v0.1.0-alpha.1);
# the tag is then created on the chosen branch by the release step.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0-alpha.1 (created on the selected branch)"
        required: true
        type: string
env:
  TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The Linux builds are static (musl): no glibc version, no kernel feature beyond the
        # basics, so they run on old distributions too. "extra" = nice to have; if one fails,
        # the release still goes out without it. "run" = the binary can be executed on the runner.
        include:
          - { os: ubuntu-26.04, name: linux-x86_64, target: x86_64-unknown-linux-musl, bin: porumbel, pack: tar, run: true, test: true }
          - { os: ubuntu-24.04-arm, name: linux-aarch64, target: aarch64-unknown-linux-musl, bin: porumbel, pack: tar, run: true, test: true, extra: true }
          - { os: ubuntu-26.04, name: linux-i686, target: i686-unknown-linux-musl, bin: porumbel, pack: tar, run: true, lld: true, extra: true }
          - { os: ubuntu-26.04, name: linux-armv7, target: armv7-unknown-linux-musleabihf, bin: porumbel, pack: tar, lld: true, extra: true }
          - { os: ubuntu-26.04, name: linux-riscv64, target: riscv64gc-unknown-linux-musl, bin: porumbel, pack: tar, lld: true, extra: true }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc, bin: porumbel.exe, pack: zip, run: true, test: true }
          - { os: macos-latest, name: macos-arm64, target: aarch64-apple-darwin, bin: porumbel, pack: tar, run: true, test: true }
          - { os: macos-15-intel, name: macos-x86_64, target: x86_64-apple-darwin, bin: porumbel, pack: tar, run: true, test: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.extra == true }}
    timeout-minutes: 40
    steps:
      - name: Tag name sanity
        shell: bash
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "tag must look like v0.1.0 or v0.1.0-alpha.1 (got $TAG)"; exit 1;; esac
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$TAG" ] || { echo "Cargo.toml says $v but the tag is $TAG"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: ${{ matrix.test }}
        run: cargo test --all-targets
      - name: Build
        shell: bash
        run: |
          # cross targets: link with the Rust-bundled lld, no C cross toolchain needed
          if [ "${{ matrix.lld }}" = "true" ]; then
            t=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
            export "CARGO_TARGET_${t}_LINKER=rust-lld"
          fi
          cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          d="porumbel-${TAG}-${{ matrix.name }}"
          mkdir "$d"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" LICENSE README*.md SECURITY.md "$d/"
          cp -r docs "$d/docs"
          if [ "${{ matrix.pack }}" = zip ]; then 7z a "$d.zip" "$d" >/dev/null; else tar czf "$d.tar.gz" "$d"; fi
          ls -l porumbel-*.tar.gz porumbel-*.zip 2>/dev/null || true
      - name: Smoke test of the packaged binary
        if: ${{ matrix.run }}
        shell: bash
        run: |
          d="porumbel-${TAG}-${{ matrix.name }}"
          "$d/${{ matrix.bin }}" --version
          "$d/${{ matrix.bin }}" --help > /dev/null
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: |
            porumbel-*.tar.gz
            porumbel-*.zip
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes"
          case "$TAG" in *-*) flags="$flags --prerelease";; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PORUMBEL $TAG" $flags
